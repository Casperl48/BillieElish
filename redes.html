<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Sociales | Billie Eilish</title>
    <style>
        :root {
            --card-bg: rgba(10, 19, 34, 0.85);
            --accent-blue: #38bdf8;
            --text-light: #ffffff;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: var(--text-light);
            line-height: 1.6;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, rgba(4, 9, 20, 0.9) 100%),
                        url('imgs/fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        header {
            padding: 3rem 1rem 1rem;
            text-align: center;
        }

        .header-title h1 {
            font-family: 'Arial Black', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .social-menu {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .social-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            color: var(--text-light);
            text-decoration: none;
            font-family: 'Arial Black', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .social-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-icon {
            width: 24px;
            height: 24px;
            fill: var(--accent-blue);
            transition: fill 0.3s;
        }

        .social-link:hover {
            background-color: var(--accent-blue);
            color: #040914;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .social-link:hover .social-icon {
            fill: #040914;
        }

        .btn-back {
            display: inline-block;
            margin: 2rem auto;
            padding: 0.8rem 2rem;
            background-color: var(--accent-blue);
            color: #040914;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            text-transform: uppercase;
            transition: transform 0.2s;
        }

        .btn-back:hover {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            margin-top: 3rem;
        }
    </style>
</head>
