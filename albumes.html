<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbumes de Estudio | Billie Eilish</title>
    <style>
        :root {
            --accent-blue: #38bdf8;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            color: var(--text-light);
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(4, 9, 20, 0.95) 100%),
                        url('imgs/fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            padding: 3rem 1rem 1rem;
            text-align: center;
        }

        .header-title h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5), 0 4px 15px rgba(0,0,0,0.9);
        }

        .container {
            max-width: 1200px;
            margin: 1rem auto;
            padding: 2rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        /* Scrapbook Collage Layout */
        .collage-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4rem 2rem;
            position: relative;
            margin-bottom: 4rem;
        }

        .album-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: transform 0.4s ease;
        }

        /* Posicionamiento al estilo de la imagen */
        .album-item.top-left {
            grid-column: 1;
            justify-self: start;
            transform: rotate(-3deg);
        }

        .album-item.top-right {
            grid-column: 2;
            justify-self: end;
            flex-direction: row-reverse;
            text-align: right;
            transform: rotate(2deg);
            margin-top: 2rem;
        }

        .album-item.bottom-center {
            grid-column: 1 / -1;
            justify-self: center;
            flex-direction: column;
            text-align: center;
            transform: rotate(-1deg);
            margin-top: 1rem;
        }

        .album-item:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
        }

        /* Vinilo y Portadas */
        .cover-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            flex-shrink: 0;
        }

        .vinyl {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: repeating-radial-gradient(
                #111 0px,
                #111 2px,
                #222 3px,
                #111 4px
            );
            border: 2px solid #000;
            box-shadow: 0 0 12px rgba(0,0,0,0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .vinyl::after {
            content: '';
            width: 65px;
            height: 65px;
            background: var(--accent-blue);
            border-radius: 50%;
            border: 12px solid #000;
        }

        /* Efectos de salida del vinilo según la posición */
        .album-item.top-left:hover .vinyl {
            transform: translateX(70px) rotate(180deg);
        }

        .album-item.top-right:hover .vinyl {
            transform: translateX(-70px) rotate(-180deg);
        }

        .album-item.bottom-center:hover .vinyl {
            transform: translateY(-60px) rotate(180deg);
        }

        /* Portadas con bordes orgánicos e irregulares */
        .album-cover {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-shadow: 8px 12px 25px rgba(0,0,0,0.85);
            transition: filter 0.3s ease;
        }

        .shape-torn-1 {
            clip-path: polygon(0% 0%, 95% 2%, 100% 95%, 5% 100%, 2% 50%);
            border-radius: 4px;
        }

        .shape-torn-2 {
            clip-path: polygon(3% 0%, 100% 4%, 96% 98%, 0% 92%);
            border-radius: 6px;
        }

        .shape-torn-3 {
            clip-path: polygon(2% 4%, 98% 0%, 95% 95%, 0% 100%);
            border-radius: 5px;
        }

        /* Información del texto directa sin cuadros */
        .album-info {
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .album-title {
            font-size: clamp(1.4rem, 2.2vw, 2.1rem);
            font-weight: 900;
            line-height: 1.1;
            color: var(--text-light);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .album-year {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Botón de Inicio */
        .nav-footer {
            text-align: center;
            margin: 2rem 0;
        }

        .btn-back {
            display: inline-block;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            padding: 0.5rem 1.5rem;
            position: relative;
            transition: color 0.3s ease;
        }

        .btn-back::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--accent-blue);
            transform: scaleX(0.6);
            transition: transform 0.3s ease;
        }

        .btn-back:hover {
            color: var(--accent-blue);
        }

        .btn-back:hover::after {
            transform: scaleX(1);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 850px) {
            .collage-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3.5rem;
            }

            .album-item.top-left,
            .album-item.top-right,
            .album-item.bottom-center {
                transform: rotate(0deg);
                flex-direction: column;
                text-align: center;
                justify-self: center;
            }

            .album-item:hover .vinyl {
                transform: translateY(-50px) rotate(180deg) !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Álbumes de Estudio</h1>
        </div>
    </header>

    <main class="container">
        <div class="collage-container">
            
            <!-- Álbum 1 (Arriba Izquierda) -->
            <a href="album-hmhas.html" class="album-item top-left">
                <div class="cover-wrapper">
                    <div class="vinyl"></div>
                    <img class="album-cover shape-torn-1" src="imgs/fondo.jpg" alt="Hit Me Hard and Soft">
                </div>
                <div class="album-info">
                    <h2 class="album-title">HIT ME HARD<br>AND SOFT</h2>
                    <p class="album-year">2024 &bull; 10 Canciones</p>
                </div>
            </a>

            <!-- Álbum 2 (Arriba Derecha) -->
            <a href="album-hte.html" class="album-item top-right">
                <div class="cover-wrapper">
                    <div class="vinyl"></div>
                    <img class="album-cover shape-torn-2" src="https://i.scdn.co/image/ab67616d0000b2732a038d3bf875d23e4aeaa84e" alt="Happier Than Ever">
                </div>
                <div class="album-info">
                    <h2 class="album-title">Happier Than Ever</h2>
                    <p class="album-year">2021 &bull; 16 Canciones</p>
                </div>
            </a>

            <!-- Álbum 3 (Abajo Centro) -->
            <a href="album-wwafawdwg.html" class="album-item bottom-center">
                <div class="cover-wrapper">
                    <div class="vinyl"></div>
                    <img class="album-cover shape-torn-3" src="https://i.scdn.co/image/ab67616d0000b27350a3147b4edd7701a876c6ce" alt="When We All Fall Asleep">
                </div>
                <div class="album-info">
                    <h2 class="album-title">WWAFA,WDWG?</h2>
                    <p class="album-year">2019 &bull; 14 Canciones</p>
                </div>
            </a>

        </div>

        <div class="nav-footer">
            <a href="index.html" class="btn-back">&larr; Volver al Inicio</a>
        </div>
    </main>

    <footer>
        <p>Diseño Web Oficial &bull; Creado por Ángel Ismael Alvarado López</p>
    </footer>

</body>
</html>
